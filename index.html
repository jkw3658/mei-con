<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5fbf">
  <title>名刺ビューア</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="row">
      <h1>名刺ビューア</h1>
      <span id="count" class="count"></span>
      <button id="reload" class="icon-btn" title="再読み込み" hidden>⟳</button>
      <button id="signin" class="btn" hidden>Googleでログイン</button>
      <button id="switch" class="link-btn" hidden>別のアカウント</button>
    </div>
    <input id="q" type="search" placeholder="名前・機関・部署・住所などで検索" autocomplete="off">
    <div class="row sort">
      <label>並び替え
        <select id="sort">
          <option value="no">登録順</option>
          <option value="date-desc">日付(新しい順)</option>
          <option value="date-asc">日付(古い順)</option>
          <option value="kana">読み方順</option>
          <option value="org">機関順</option>
        </select>
      </label>
      <span id="demo" class="badge" hidden>デモデータ</span>
    </div>
  </header>

  <main id="list" class="list"></main>
  <p id="msg" class="msg"></p>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="window.onGisLoad && onGisLoad()"></script>
</body>
</html>
